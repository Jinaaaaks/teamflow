<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TeamFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>TeamFlow, Team Edition</h1>

  <div class="task-input">
    <input type="text" id="taskTitle" placeholder="Enter task title">
    <button id="addTaskBtn">Add Task</button>
  </div>

  <div class="board">
    <div class="col">
      <h2>Todo</h2>
      <ul id="todoList"></ul>
    </div>

    <div class="col">
      <h2>In Progress</h2>
      <ul id="progressList"></ul>
    </div>

    <div class="col">
      <h2>Done</h2>
      <ul id="doneList"></ul>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
