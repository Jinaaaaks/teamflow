<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TeamFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="app-title">TeamFlow</h1>
  <p class="app-subtitle">Your mini team task board</p>

  <div class="topbar">
    <div class="task-input">
        <input type="text" id="taskTitle" placeholder="Enter task title">
        <button id="addTaskBtn">Add Task</button>
    </div>
  </div>

  <div class="board">
    <div class="col progress">
        <div class="col-header">
          <h2>In Progress</h2>
          <span class="count" id="progressCount">0</span>
        </div>
        <ul id="progressList" class="task-list"></ul>
    </div>

    <div class="col done">
      <div class="col-header">
        <h2>Done</h2>
          <span class="count" id="doneCount">0</span>
      </div>
      <ul id="doneList" class="task-list"></ul>
    </div>
  </div>
  
  <script src="script.js"></script>

</body>
</html>
